spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/student_management?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:sms_user}
    password: ${DB_PASSWORD:sms_password}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    properties.hibernate.jdbc.time_zone: UTC
  flyway.enabled: true
  jackson.default-property-inclusion: non_null
server:
  port: ${SERVER_PORT:8080}
  error.include-message: never
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-with-at-least-32-characters}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors.allowed-origin: ${CORS_ORIGIN:http://localhost:5173}
