services:
  # --------------------------------------------------
  # 1. AI Python Flask Microservice
  # --------------------------------------------------
  - type: web
    name: campuscore-ai-service
    env: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PORT
        value: 5001

  # --------------------------------------------------
  # 2. Spring Boot Java Backend
  # --------------------------------------------------
  - type: web
    name: campuscore-backend
    env: java
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/student-management-system-1.0.0.jar --spring.profiles.active=local
    envVars:
      - key: PORT
        value: 8080
      - key: SERVER_PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: local
      # Link private network connection to the AI Flask microservice
      - key: AI_SERVICE_URL
        value: http://campuscore-ai-service:5001

  # --------------------------------------------------
  # 3. React Frontend (Static Site)
  # --------------------------------------------------
  - type: web
    name: campuscore-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    # Point the build script to use your backend service's URL (e.g. https://campuscore-backend.onrender.com/api)
    envVars:
      - key: VITE_API_URL
        value: https://campuscore-backend.onrender.com/api
    routes:
      # Support React Router browser routing fallback
      - type: rewrite
        source: /*
        destination: /index.html
